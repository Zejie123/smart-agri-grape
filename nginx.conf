# ============================================================
#  智慧农业平台 - Nginx 反向代理配置
#
#  作用：
#   1. 托管 Vue 前端构建产物（frontend/dist），浏览器直接访问 / 即可打开大屏
#   2. 将 /api 请求反向代理到后端 Spring Boot（默认 127.0.0.1:8080），
#      实现前后端「同源」交互，不再依赖后端 CORS
#
#  使用（Windows，Nginx 安装目录下）：
#   1. cd frontend && npm install && npm run build   # 先构建前端，产出 dist/
#   2. 启动后端：双击项目根目录 start.bat（后端监听 8080，context-path=/api）
#   3. 把本文件内容覆盖 nginx/conf/nginx.conf 中的 server 段（或 include 本文件）
#   4. 启动 nginx：nginx.exe，浏览器访问 http://localhost/
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # gzip 开启，加速静态资源加载
    gzip  on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream agri_backend {
        # 后端 Spring Boot 地址（与 application.yml 的端口一致，可改）
        server 127.0.0.1:8080;
    }

    server {
        listen       80;          # 前端访问端口，可改（如 8088）
        server_name  localhost;

        # ---------- 前端静态资源（Vue 构建产物 dist/） ----------
        # 将 root 指向 frontend/dist 的绝对路径（按实际路径修改）
        root   C:/Users/ASUS/Desktop/smart-agri-grape/frontend/dist;
        index  index.html;

        # SPA 路由回退：任何不存在的路径都返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------- 后端 API 反向代理 ----------
        # 后端 context-path 已是 /api，这里不加尾斜杠，即可把完整 /api/... 透传
        location /api/ {
            proxy_pass http://agri_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }
    }
}
